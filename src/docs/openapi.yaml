# Overdue: The Great Return API - OpenAPI 3 document, written by hand.
# Served as GET /api/v1/openapi.json and as Swagger UI at GET /api/v1/docs/.
# info.version is replaced at start-up by the version in package.json.
openapi: 3.0.3
info:
  title: "Overdue: The Great Return API"
  version: 1.0.0
  description: >
    Backend API for Overdue: The Great Return, a multiplayer quiz race for the SorSU Bulan Campus library.
    A host builds a question set, opens a game with a six-digit join code, and players race to return
    10 overdue books by answering trivia questions. The server times every answer and scores it with
    round(1000 * (1 - elapsed / (2 * limit))); a wrong or late answer scores 0.
    Implements Hub Contract v1.3. Every error answers { "error": { "code", "message" } }.


    Log in with POST /auth/login, then click Authorize and paste the token.
  contact:
    name: Carl Angelo Orlina (icedteacrml11)
servers:
  - url: /api/v1
    description: This server
tags:
  - name: Hub Contract
    description: The endpoints every game provides to the Library Game Hub
  - name: Accounts
    description: Registration, login, and admin role management
  - name: Question Sets
    description: A host's question sets, their questions and choices, and the cover picture
  - name: Sessions
    description: Games, the players seated in them, and live gameplay

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token from POST /auth/login
    hubKey:
      type: apiKey
      in: header
      name: X-Hub-Key
      description: The key the Library Game Hub sends

  parameters:
    SetId:
      name: id
      in: path
      required: true
      description: The question set id (a positive whole number)
      schema:
        type: integer
        minimum: 1
        example: 1
    QuestionId:
      name: questionId
      in: path
      required: true
      description: The question id (a positive whole number)
      schema:
        type: integer
        minimum: 1
        example: 1
    Code:
      name: code
      in: path
      required: true
      description: The six-digit join code (does not start with 0)
      schema:
        type: string
        pattern: "^[1-9][0-9]{5}$"
        example: "482913"

  responses:
    BadRequest:
      description: The request is malformed (a field, the URL or the JSON itself)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: title must be 3 to 100 characters long
              details:
                - field: title
                  message: title must be 3 to 100 characters long
    Unauthorized:
      description: No login (AUTH_REQUIRED), or the token is forged, damaged or expired (INVALID_TOKEN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: AUTH_REQUIRED
              message: "Log in first: send the header Authorization: Bearer <token>."
    Forbidden:
      description: Logged in, but not allowed to do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: This question set belongs to another host.
    SetNotFound:
      description: QUESTION_SET_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: QUESTION_SET_NOT_FOUND
              message: No question set has the id 999.
    SessionNotFound:
      description: SESSION_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SESSION_NOT_FOUND
              message: No game session has the code 999999.
    SetInUse:
      description: QUESTION_SET_IN_USE - the set was used in a game and is frozen
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: QUESTION_SET_IN_USE
              message: This question set was used in a game and is now frozen.

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        school_id:
          type: string
          example: "2099-0001"
        full_name:
          type: string
          example: Librarian Clara Reyes
        email:
          type: string
          format: email
          example: clara.reyes@sorsu.edu.ph
        role:
          type: string
          enum:
            - PLAYER
            - HOST
            - ADMIN
    Meta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 23
        pages:
          type: integer
          example: 3
    Choice:
      type: object
      properties:
        id:
          type: integer
          example: 1
        question_id:
          type: integer
          example: 1
        choice_text:
          type: string
          example: Main Library, 2nd floor
        position:
          type: integer
          example: 1
        is_correct:
          type: boolean
          description: Only hosts see this. Players never receive it.
          example: true
    Question:
      type: object
      properties:
        id:
          type: integer
          example: 1
        question_set_id:
          type: integer
          example: 1
        question_type:
          type: string
          enum:
            - MULTIPLE_CHOICE
            - TRUE_FALSE
        prompt_text:
          type: string
          example: Where is the Filipiniana section?
        position:
          type: integer
          description: Chosen by the server (the next free position)
          example: 1
        time_limit_seconds:
          type: integer
          example: 20
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
    PublicChoice:
      type: object
      description: A choice as players see it - never with is_correct
      properties:
        id:
          type: integer
          example: 1
        question_id:
          type: integer
          example: 1
        choice_text:
          type: string
          example: Main Library, 2nd floor
        position:
          type: integer
          example: 1
    PublicQuestion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        question_set_id:
          type: integer
          example: 1
        question_type:
          type: string
          example: MULTIPLE_CHOICE
        prompt_text:
          type: string
          example: Where is the Filipiniana section?
        position:
          type: integer
          example: 1
        time_limit_seconds:
          type: integer
          example: 20
        question_started_at:
          type: string
          format: date-time
        choices:
          type: array
          items:
            $ref: "#/components/schemas/PublicChoice"
    QuestionSet:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: SorSU Library Trivia
        host_id:
          type: integer
          example: 1
        cover_url:
          type: string
          nullable: true
          example: /uploads/covers/set-1-6e6213b7-4b8b-4cbd-b832-1b49e5481967.png
        created_at:
          type: string
          format: date-time
        questions:
          type: array
          description: Only with ?include=questions
          items:
            $ref: "#/components/schemas/Question"
    Session:
      type: object
      properties:
        id:
          type: integer
          example: 2
        code:
          type: string
          example: "345793"
        join_code:
          type: string
          example: "345793"
        host_id:
          type: integer
          example: 1
        question_set_id:
          type: integer
          example: 1
        status:
          type: string
          enum:
            - LOBBY
            - ACTIVE
            - RUNNING
            - FINISHED
        current_position:
          type: integer
          nullable: true
          example: 1
        question_started_at:
          type: string
          format: date-time
          nullable: true
        winner_player_id:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    QuestionInput:
      type: object
      properties:
        prompt_text:
          type: string
          minLength: 3
          maxLength: 500
          example: Where is the Filipiniana section?
        question_type:
          type: string
          enum:
            - MULTIPLE_CHOICE
            - TRUE_FALSE
          default: MULTIPLE_CHOICE
        time_limit_seconds:
          type: integer
          minimum: 5
          maximum: 120
          default: 20
        choices:
          type: array
          minItems: 2
          maxItems: 4
          description: Exactly one choice must have is_correct true. Positions are set by the server.
          items:
            type: object
            required:
              - choice_text
              - is_correct
            properties:
              choice_text:
                type: string
                minLength: 1
                maxLength: 255
                example: Main Library, 2nd floor
              is_correct:
                type: boolean
                example: true

paths:
  # ---------------------------------------------------------------- Hub Contract
  /health:
    get:
      tags:
        - Hub Contract
      summary: Is the API up, and can it reach the database?
      responses:
        "200":
          description: Up
          content:
            application/json:
              example:
                status: ok
                service: overdue-the-great-return-api
                version: 1.0.0
                database: up
                uptime_seconds: 42
                timestamp: "2026-11-25T02:00:00.000Z"
        "503":
          description: The database cannot be reached (status degraded, database down)
  /game-info:
    get:
      tags:
        - Hub Contract
      summary: What the Hub shows about this game
      responses:
        "200":
          description: The game card
          content:
            application/json:
              example:
                slug: overdue-the-great-return
                name: "Overdue: The Great Return"
                team: BSCS 3-2
                developer: icedteacrml11
                description: Race across campus to return 10 overdue books by answering trivia questions.
                min_players: 1
                max_players: 30
                version: 1.0.0
  /results:
    get:
      tags:
        - Hub Contract
      summary: Finished games, every player, and the podium (rule 7)
      description: Oldest game first. Equal scores share a rank; a player who did not complete the game has rank null.
      security:
        - hubKey: []
      parameters:
        - name: since
          in: query
          description: Only games that ended after this date and time (ISO 8601)
          schema:
            type: string
            format: date-time
            example: "2026-11-01T00:00:00Z"
      responses:
        "200":
          description: The finished games
          content:
            application/json:
              example:
                game: overdue-the-great-return
                developer: icedteacrml11
                generated_at: "2026-11-25T02:00:00.000Z"
                results:
                  - session_code: "482913"
                    started_at: "2026-11-10T09:00:00.000Z"
                    ended_at: "2026-11-10T09:12:00.000Z"
                    players:
                      - school_id: "2099-1001"
                        nickname: Pageturner
                        score: 6824
                        completed: true
                        rank: 1
                    podium:
                      - rank: 1
                        school_id: "2099-1001"
                        nickname: Pageturner
                        score: 6824
        "400":
          description: INVALID_SINCE - since is not a date and time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_SINCE
                  message: since must be a date and time, for example 2026-10-20T00:00:00Z.
        "401":
          description: The X-Hub-Key header is missing or wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------- Accounts
  /auth/register:
    post:
      tags:
        - Accounts
      summary: Create a PLAYER account
      description: A role in the body is ignored. Admins promote hosts with PATCH /users/{id}/role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - school_id
                - full_name
                - email
                - password
              properties:
                school_id:
                  type: string
                  pattern: "^\\d{4}-\\d{4}$"
                  example: "2099-3001"
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Nina Cruz
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: nina.cruz@sorsu.edu.ph
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: At least one letter and one number
                  example: Libro-2026
      responses:
        "201":
          description: Created. The password and its hash are never returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: SCHOOL_ID_TAKEN or EMAIL_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SCHOOL_ID_TAKEN
                  message: An account with that school ID already exists.
  /auth/login:
    post:
      tags:
        - Accounts
      summary: School ID and password in, a token out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - school_id
                - password
              properties:
                school_id:
                  type: string
                  example: "2099-0001"
                password:
                  type: string
                  example: Aklat-Demo-2026
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.sig
                token_type: Bearer
                expires_in: 1h
                user:
                  user_id: 1
                  school_id: "2099-0001"
                  full_name: Librarian Clara Reyes
                  email: clara.reyes@sorsu.edu.ph
                  role: HOST
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: INVALID_CREDENTIALS - the same answer for an unknown school ID and a wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid school ID or password.
  /auth/me:
    get:
      tags:
        - Accounts
      summary: The account of the token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      tags:
        - Accounts
      summary: List every account (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every account
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}/role:
    patch:
      tags:
        - Accounts
      summary: Change an account's role (admin only)
      description: An admin cannot change their own role (409 SELF_ROLE_CHANGE).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user_id of the account
          schema:
            type: integer
            minimum: 1
            example: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - PLAYER
                    - HOST
                    - ADMIN
                  example: HOST
      responses:
        "200":
          description: The account with its new role
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: SELF_ROLE_CHANGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SELF_ROLE_CHANGE
                  message: An admin cannot change their own role.

  # ---------------------------------------------------------------- Question Sets
  /question-sets:
    get:
      tags:
        - Question Sets
      summary: List my question sets, one page at a time
      description: A host sees their own sets; an admin sees every set. An empty page is still 200.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: sort
          in: query
          description: Only a column on this list (anything else answers 400)
          schema:
            type: string
            enum:
              - id
              - title
              - created_at
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: q
          in: query
          description: Search word in the title (case-insensitive)
          schema:
            type: string
            maxLength: 100
            example: library
      responses:
        "200":
          description: One page of question sets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuestionSet"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Question Sets
      summary: Create a question set owned by the caller
      description: The owner is always the caller; a client can never choose host_id.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: SorSU Library Trivia
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /question-sets/{id}:
    get:
      tags:
        - Question Sets
      summary: Read one question set (optionally with its questions and choices)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
        - name: include
          in: query
          description: questions loads the questions and their choices in one query
          schema:
            type: string
            enum:
              - questions
      responses:
        "200":
          description: The question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SetNotFound"
    patch:
      tags:
        - Question Sets
      summary: Rename a question set that no game has used
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: SorSU Library Trivia (Week 2)
      responses:
        "200":
          description: The updated question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SetNotFound"
        "409":
          $ref: "#/components/responses/SetInUse"
    delete:
      tags:
        - Question Sets
      summary: Delete a question set that no game has used
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
      responses:
        "204":
          description: Deleted (no body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SetNotFound"
        "409":
          $ref: "#/components/responses/SetInUse"
  /question-sets/{id}/cover:
    put:
      tags:
        - Question Sets
      summary: Upload the cover picture (one PNG or JPEG, at most 1 MB)
      description: The server chooses the file name; the client's file name is never used.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - cover
              properties:
                cover:
                  type: string
                  format: binary
      responses:
        "200":
          description: The question set with its new cover_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          description: INVALID_FILE_TYPE (not PNG or JPEG), COVER_REQUIRED or INVALID_UPLOAD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_FILE_TYPE
                  message: cover must be a PNG or JPEG picture
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SetNotFound"
        "413":
          description: FILE_TOO_LARGE - more than 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /question-sets/{id}/questions:
    get:
      tags:
        - Question Sets
      summary: List the questions and choices of a set, by position
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
      responses:
        "200":
          description: The questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SetNotFound"
    post:
      tags:
        - Question Sets
      summary: Add a question and its 2 to 4 choices (all-or-nothing)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/QuestionInput"
                - required:
                    - prompt_text
                    - choices
            example:
              prompt_text: Where is the Filipiniana section?
              question_type: MULTIPLE_CHOICE
              time_limit_seconds: 20
              choices:
                - choice_text: Main Library, 2nd floor
                  is_correct: true
                - choice_text: Canteen
                  is_correct: false
      responses:
        "201":
          description: Created, with its choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SetNotFound"
        "409":
          $ref: "#/components/responses/SetInUse"
  /question-sets/{id}/questions/{questionId}:
    patch:
      tags:
        - Question Sets
      summary: Change a question, or replace its choices
      description: Send at least one of prompt_text, question_type, time_limit_seconds, choices.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
            example:
              prompt_text: Which floor has the Filipiniana section?
      responses:
        "200":
          description: The updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: QUESTION_SET_NOT_FOUND or QUESTION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/SetInUse"
    delete:
      tags:
        - Question Sets
      summary: Delete a question from a set that no game has used
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SetId"
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "204":
          description: Deleted (no body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: QUESTION_SET_NOT_FOUND or QUESTION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/SetInUse"

  # ---------------------------------------------------------------- Sessions
  /sessions:
    post:
      tags:
        - Sessions
      summary: Open a game in LOBBY; the server picks the six-digit code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question_set_id
              properties:
                question_set_id:
                  type: integer
                  minimum: 1
                  example: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SetNotFound"
        "409":
          description: EMPTY_QUESTION_SET - add at least one question first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{code}:
    get:
      tags:
        - Sessions
      summary: Read one game by its join code
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: The game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"
    patch:
      tags:
        - Sessions
      summary: Start or finish the game, or move to the next question (its host only)
      description: >
        status LOBBY -> RUNNING (or ACTIVE) sets current_position 1 and starts the clock; any status -> FINISHED
        ends it. current_position may only be the next position.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send status or current_position
              properties:
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - RUNNING
                    - FINISHED
                current_position:
                  type: integer
                  minimum: 1
            examples:
              start:
                summary: Start the game
                value:
                  status: RUNNING
              next:
                summary: Go to question 2
                value:
                  current_position: 2
              finish:
                summary: End the game
                value:
                  status: FINISHED
      responses:
        "200":
          description: The updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: INVALID_STATUS_CHANGE, SESSION_NOT_ACTIVE, NOT_NEXT_QUESTION or NO_MORE_QUESTIONS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_NEXT_QUESTION
                  message: The next question is position 2.
  /sessions/{code}/players:
    post:
      tags:
        - Sessions
      summary: Join a game in LOBBY (201), or rejoin my seat (200)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nickname
              properties:
                nickname:
                  type: string
                  minLength: 2
                  maxLength: 30
                  example: Pageturner
      responses:
        "200":
          description: Rejoined - this account already had a seat (same row, same score)
          content:
            application/json:
              example:
                player_id: 4
                nickname: Pageturner
                score: 750
                distance_progress: 1
                rejoined: true
                session:
                  code: "345793"
                  status: RUNNING
        "201":
          description: Seated
          content:
            application/json:
              example:
                player_id: 4
                nickname: Pageturner
                score: 0
                distance_progress: 0
                rejoined: false
                session:
                  code: "345793"
                  status: LOBBY
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: NICKNAME_TAKEN, SESSION_NOT_JOINABLE, SESSION_ENDED or SESSION_FULL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NICKNAME_TAKEN
                  message: That nickname is already used in this game.
    get:
      tags:
        - Sessions
      summary: List the players of a game (nicknames and scores only)
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: The players
          content:
            application/json:
              example:
                - nickname: Pageturner
                  score: 1500
                  distance_progress: 2
                - nickname: Bookworm
                  score: 750
                  distance_progress: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"
  /sessions/{code}/question:
    get:
      tags:
        - Sessions
      summary: The current question and its choices (never is_correct)
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: The current question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: SESSION_NOT_FOUND or QUESTION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: SESSION_NOT_ACTIVE - the game has not started or has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{code}/answers:
    post:
      tags:
        - Sessions
      summary: Answer the current question; the server times and scores it
      description: >
        Checked in this order - the game is running (409 SESSION_NOT_ACTIVE), the caller is seated (403),
        it is the current question (409 NOT_CURRENT_QUESTION), the choice belongs to it (400 INVALID_CHOICE).
        One answer per player per question (409 ALREADY_ANSWERED).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question_id
                - choice_id
              properties:
                question_id:
                  type: integer
                  minimum: 1
                  example: 1
                choice_id:
                  type: integer
                  minimum: 1
                  example: 1
      responses:
        "201":
          description: Recorded and scored
          content:
            application/json:
              example:
                answer_id: 7
                question_id: 1
                choice_id: 1
                is_correct: true
                points_awarded: 750
                elapsed_ms: 10000
                total_score: 750
                distance_progress: 1
        "400":
          description: VALIDATION_FAILED or INVALID_CHOICE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_CHOICE
                  message: That choice does not belong to this question.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: FORBIDDEN - you are not seated in this game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: SESSION_NOT_ACTIVE, NOT_CURRENT_QUESTION or ALREADY_ANSWERED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ALREADY_ANSWERED
                  message: You have already answered this question.
  /sessions/{code}/leaderboard:
    get:
      tags:
        - Sessions
      summary: The game's leaderboard; equal scores share a rank (1, 2, 2, 4)
      parameters:
        - $ref: "#/components/parameters/Code"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 10
      responses:
        "200":
          description: The leaderboard
          content:
            application/json:
              example:
                session_code: "345793"
                status: FINISHED
                leaderboard:
                  - rank: 1
                    player_id: 4
                    user_id: 4
                    nickname: ReaderOne
                    score: 1500
                    distance_progress: 2
                  - rank: 2
                    player_id: 5
                    user_id: 5
                    nickname: ReaderTwo
                    score: 750
                    distance_progress: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"
