$kind: http-request
name: 20. Rejoin running game - POST /sessions/{{code}}/players as player 1
url: "{{baseUrl}}/sessions/{{code}}/players"
method: POST
headers:
  Content-Type: application/json
  X-Demo-User: "{{player}}"
body:
  type: text
  content: |-
    {
      "nickname": "BookRunner"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200 and returning player is let back in', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.rejoined).to.eql(true);
        pm.expect(body.session.status).to.eql('ACTIVE');
      });
    language: text/javascript
order: 20000

