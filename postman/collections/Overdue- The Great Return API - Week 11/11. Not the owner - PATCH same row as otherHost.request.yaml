$kind: http-request
url: "{{baseUrl}}/question-sets/{{setId}}"
method: PATCH
headers:
  Content-Type: application/json
  X-Demo-User: "{{otherHost}}"
body:
  type: text
  content: |-
    {
      "title": "Hijacked Title"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 403 FORBIDDEN', function () {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().error.code).to.eql('FORBIDDEN');
      });
    language: text/javascript
order: 11000
