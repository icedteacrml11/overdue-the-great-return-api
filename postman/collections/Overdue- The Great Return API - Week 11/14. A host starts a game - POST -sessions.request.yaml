$kind: http-request
name: 14. A host starts a game - POST /sessions
url: "{{baseUrl}}/sessions"
method: POST
headers:
  Content-Type: application/json
  X-Demo-User: "{{host}}"
body:
  type: text
  content: |-
    {
      "question_set_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201 and LOBBY with 6-digit code', function () {
        pm.response.to.have.status(201);
        const body = pm.response.json();
        pm.expect(body.status).to.eql('LOBBY');
        pm.expect(body.code).to.match(/^[1-9][0-9]{5}$/);
        pm.collectionVariables.set("code", pm.response.json().code);
      });
    language: text/javascript
order: 14000

