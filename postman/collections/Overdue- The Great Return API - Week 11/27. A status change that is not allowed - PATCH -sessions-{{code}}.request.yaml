$kind: http-request
name: 27. A status change that is not allowed - PATCH /sessions/{{code}}
url: "{{baseUrl}}/sessions/{{code}}"
method: PATCH
headers:
  Content-Type: application/json
  X-Demo-User: "{{host}}"
body:
  type: text
  content: |-
    {
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 409 INVALID_STATUS_CHANGE', function () {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error.code).to.eql('INVALID_STATUS_CHANGE');
      });
    language: text/javascript
order: 27000

