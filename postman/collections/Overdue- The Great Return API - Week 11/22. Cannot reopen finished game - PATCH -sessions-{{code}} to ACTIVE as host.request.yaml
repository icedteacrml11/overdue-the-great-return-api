$kind: http-request
name: 22. Cannot reopen finished game - PATCH /sessions/{{code}} to ACTIVE as host
url: "{{baseUrl}}/sessions/{{code}}"
method: PATCH
headers:
  Content-Type: application/json
  X-Demo-User: "{{host}}"
body:
  type: text
  content: |-
    {
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 409 INVALID_STATUS_CHANGE', function () {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error.code).to.eql('INVALID_STATUS_CHANGE');
      });
    language: text/javascript
order: 22000

