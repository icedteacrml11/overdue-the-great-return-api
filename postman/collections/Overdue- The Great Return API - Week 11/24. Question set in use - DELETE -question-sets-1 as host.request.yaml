$kind: http-request
name: 24. Question set in use - DELETE /question-sets/1 as host
url: "{{baseUrl}}/question-sets/1"
method: DELETE
headers:
  X-Demo-User: "{{host}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 409 QUESTION_SET_IN_USE', function () {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error.code).to.eql('QUESTION_SET_IN_USE');
      });
    language: text/javascript
order: 24000

