$kind: http-request
url: "{{baseUrl}}/question-sets/{{setId}}"
method: PATCH
headers:
  Content-Type: application/json
  X-Demo-User: "{{host}}"
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 400 VALIDATION_FAILED', function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('VALIDATION_FAILED');
      });
    language: text/javascript
order: 12000
