$kind: http-request
name: 18. A code that no game uses - GET /sessions/999999
url: "{{baseUrl}}/sessions/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404 SESSION_NOT_FOUND', function () {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql('SESSION_NOT_FOUND');
      });
    language: text/javascript
order: 18000

