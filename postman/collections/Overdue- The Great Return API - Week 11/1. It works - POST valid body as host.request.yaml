$kind: http-request
url: "{{baseUrl}}/question-sets"
method: POST
headers:
  Content-Type: application/json
  X-Demo-User: "{{host}}"
body:
  type: text
  content: |-
    {
      "title": "Philippine Literature"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.collectionVariables.set('setId', pm.response.json().id);
    language: text/javascript
order: 1000
